# declarative validation rules and thresholds
validation:
  # absolute coordinates bounds (hard errors)
  coordinate_bounds:
    latitude_min: -90.0
    latitude_max: 90.0
    longitude_min: -180.0
    longitude_max: 180.0

  # operational bounding box (severity: warning)
  # derived from Brussels FIR (EBBU) + configurable margin
  operational_bounding_box:
    severity: "warning"
    min_lat: 49.0
    max_lat: 52.0
    min_lon: 2.0
    max_lon: 7.0
    margin_degrees: 0.25

  # format constraints
  icao_format: "^[A-Z]{4}$"
  runway_designator_format: "^(0[1-9]|[12][0-9]|3[0-6])[LCR]?$"

  # declared distance integrity checks
  declared_distances:
    require_tora_le_toda: true
    require_asda_ge_tora: true
    require_lda_positive: true

  # promotion gate thresholds
  promotion_gate:
    max_error_issues: 0
    max_warning_issues: 100
    max_disappeared_runways_pct: 0.0
    max_disappeared_features_pct: 5.0
