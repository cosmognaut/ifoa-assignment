# section discovery/table allocation specification
# both file matching and element anchor/heading locators are supported.
# see https://www.eurocontrol.int/publication/eurocontrol-specification-electronic-aeronautical-information-publication-eaip
#
# This file is the single source of truth for WHAT gets ingested. Discovery
# derives its download list from this list alone; nothing here is restated in
# Python.
#
# Key semantics:
#   id                      stable section identifier. Never templated.
#   name                    human label, emitted by discovery and used in logs.
#   category                "GEN" | "ENR" | "AD". Emitted by discovery.
#   scope                   "global"       -> one document for the whole AIP
#                           "per_airport"  -> one document per entry in
#                                             airports.yaml target_airports
#   document_id             identity of the FILE this section lives in. All
#                           sections sharing a document_id are grouped into a
#                           single download. Optional; defaults to `id`.
#                           Templated with {icao} when present.
#   file_template           filename, templated with {icao}. Per-airport sections.
#   file_pattern            filename, no templating. Global sections.
#   anchor / anchor_template / heading_pattern / target_type
#                           consumed by the parse layer to locate the slice
#                           inside the downloaded document.

converters_regex:
  coordinates_dms: "(\\d{2})(\\d{2})(\\d{2}(?:\\.\\d+)?)\\s*([NS])\\s*(\\d{3})(\\d{2})(\\d{2}(?:\\.\\d+)?)\\s*([EW])"
  coordinates_dms_compact: "^(\\d{2})(\\d{2})(\\d{2}(?:\\.\\d+)?)([NS])(\\d{3})(\\d{2})(\\d{2}(?:\\.\\d+)?)([EW])$"
  dimensions: "(\\d+(?:[\\s\\u2009\\xa0]\\d+)?)\\s*[xX]\\s*(\\d+)"
  bearing: "(\\d+(?:\\.\\d+)?)"
  elevation: "THR\\s+(\\d+(?:\\.\\d+)?)\\s*FT"
  elevation_fallback: "(\\d+(?:\\.\\d+)?)"
  distance: "(\\d+(?:[\\s\\u2009\\xa0]\\d+)?)"

surface_mapping:
  asphalt: "ASPH"
  concrete: "CONC"
  grass: "GRAS"
  default: "OTHER"

sections:
  # General Information
  - id: "GEN-0.2"
    name: "Record of AIP Amendments"
    category: "GEN"
    scope: "global"
    file_pattern: "EB-GEN-0.2-en-GB.html"
    anchor: "GEN-0.2"
    heading_pattern: "GEN 0.2"
    target_type: "publicationMetadata"

  - id: "GEN-2.5"
    name: "List of Radio Navigation Aids"
    category: "GEN"
    scope: "global"
    file_pattern: "EB-GEN-2.5-en-GB.html"
    anchor: "GEN-2.5"
    heading_pattern: "GEN 2.5"
    target_type: "navaid"

  # Aerodrome Sections (All live in EB-AD-2.{icao}-en-GB.html)
  - id: "AD-2.1"
    name: "Aerodrome Location Indicator and Name"
    category: "AD"
    scope: "per_airport"
    document_id: "AD-2.{icao}"
    file_template: "EB-AD-2.{icao}-en-GB.html"
    anchor_template: "{icao}-AD-2.1"
    heading_pattern: "AD 2.1"
    target_type: "aerodrome"

  - id: "AD-2.2"
    name: "Aerodrome Geographical and Administrative Data"
    category: "AD"
    scope: "per_airport"
    document_id: "AD-2.{icao}"
    file_template: "EB-AD-2.{icao}-en-GB.html"
    anchor_template: "{icao}-AD-2.2"
    heading_pattern: "AD 2.2"
    target_type: "aerodrome"
    fields:
      arpCoordinates:
        header_pattern: "arp coordinates"
        converter: "coordinates"
      elevation:
        header_pattern: "elevation / reference"
        converter: "elevation"
        unit: "FT"
      geoidUndulation:
        header_pattern: "geoid undulation"
        converter: "elevation"
        unit: "FT"
      referenceTemperature:
        header_pattern: "reference temperature"
        converter: "text"
      magneticVariation:
        header_pattern: "magnetic variation"
        converter: "text"
      operatorName:
        header_pattern: "name of ad operator"
        converter: "text"
      operatorAddress:
        header_pattern: "address"
        converter: "text"
      operatorTel:
        header_pattern: "tel"
        converter: "text"
      operatorFax:
        header_pattern: "fax"
        converter: "text"
      operatorEmail:
        header_pattern: "email"
        converter: "text"
      operatorAfs:
        header_pattern: "afs"
        converter: "text"
      trafficPermitted:
        header_pattern: "types of traffic permitted"
        converter: "text"

  - id: "AD-2.3"
    name: "Operational Hours"
    category: "AD"
    scope: "per_airport"
    document_id: "AD-2.{icao}"
    file_template: "EB-AD-2.{icao}-en-GB.html"
    anchor_template: "{icao}-AD-2.3"
    heading_pattern: "AD 2.3"
    target_type: "operationalInfo"
    fields:
      hoursOperator:
        header_pattern: "ad operator"
        converter: "text"
      hoursCustoms:
        header_pattern: "customs and immigration"
        converter: "text"
      hoursHealth:
        header_pattern: "health"
        converter: "text"
      hoursAisBriefing:
        header_pattern: "ais briefing office"
        converter: "text"
      hoursAro:
        header_pattern: "ats reporting office"
        converter: "text"
      hoursMet:
        header_pattern: "met briefing"
        converter: "text"
      hoursATS:
        header_pattern: "ats"
        converter: "text"
      hoursFuelling:
        header_pattern: "fuelling"
        converter: "text"
      hoursHandling:
        header_pattern: "handling"
        converter: "text"
      hoursSecurity:
        header_pattern: "security"
        converter: "text"
      hoursDeicing:
        header_pattern: "de-icing"
        converter: "text"

  - id: "AD-2.6"
    name: "Rescue and Fire Fighting Services"
    category: "AD"
    scope: "per_airport"
    document_id: "AD-2.{icao}"
    file_template: "EB-AD-2.{icao}-en-GB.html"
    anchor_template: "{icao}-AD-2.6"
    heading_pattern: "AD 2.6"
    target_type: "operationalInfo"
    fields:
      rffsCategory:
        header_pattern: "aerodrome category for fire fighting"
        converter: "text"
      rffsEquipment:
        header_pattern: "rescue equipment"
        converter: "text"
      disabledAircraftRemoval:
        header_pattern: "capability for removal"
        converter: "text"
      remarks:
        header_pattern: "remarks"
        converter: "text"

  - id: "AD-2.12"
    name: "Runway Physical Characteristics"
    category: "AD"
    scope: "per_airport"
    document_id: "AD-2.{icao}"
    file_template: "EB-AD-2.{icao}-en-GB.html"
    anchor_template: "{icao}-AD-2.12"
    heading_pattern: "AD 2.12"
    target_type: "runwayDirection"
    table_locator:
      required_headers:
        - "rwy designator"
        - "true brg"
    fields:
      designator:
        header_pattern: "rwy designator"
        converter: "text"
      trueBearing:
        header_pattern: "true brg"
        converter: "bearing"
        unit: "DEG"
      dimensions:
        header_pattern: "dimensions of rwy"
        converter: "dimensions"
        subfields:
          length:
            unit: "M"
          width:
            unit: "M"
      strength:
        header_pattern: "strength"
        converter: "surface_strength"
      thresholdCoordinates:
        header_pattern: "thr coord"
        converter: "coordinates"
      thresholdElevation:
        header_pattern: "thr elev"
        converter: "elevation"
        unit: "FT"
    pair_fields:
      pairDesignator:
        unit: null
      length:
        unit: "M"
      width:
        unit: "M"
      surface:
        unit: null

  - id: "AD-2.13"
    name: "Declared Distances"
    category: "AD"
    scope: "per_airport"
    document_id: "AD-2.{icao}"
    file_template: "EB-AD-2.{icao}-en-GB.html"
    anchor_template: "{icao}-AD-2.13"
    heading_pattern: "AD 2.13"
    target_type: "runwayDirection"
    table_locator:
      required_headers:
        - "tora"
        - "lda"
    fields:
      tora:
        header_pattern: "tora"
        converter: "distance"
        unit: "M"
      toda:
        header_pattern: "toda"
        converter: "distance"
        unit: "M"
      asda:
        header_pattern: "asda"
        converter: "distance"
        unit: "M"
      lda:
        header_pattern: "lda"
        converter: "distance"
        unit: "M"
      remarks:
        header_pattern: "rmk"
        converter: "text"

  - id: "AD-2.19"
    name: "Radio Navigation and Landing Aids"
    category: "AD"
    scope: "per_airport"
    document_id: "AD-2.{icao}"
    file_template: "EB-AD-2.{icao}-en-GB.html"
    anchor_template: "{icao}-AD-2.19"
    heading_pattern: "AD 2.19"
    target_type: "navaid"

  - id: "AD-2.20"
    name: "Local Aerodrome Regulations"
    category: "AD"
    scope: "per_airport"
    document_id: "AD-2.{icao}"
    file_template: "EB-AD-2.{icao}-en-GB.html"
    anchor_template: "{icao}-AD-2.20"
    heading_pattern: "AD 2.20"
    target_type: "operationalInfo"

  # En-Route Sections
  - id: "ENR-2.1"
    name: "Air Traffic Services Airspace"
    category: "ENR"
    scope: "global"
    file_pattern: "EB-ENR-2.1-en-GB.html"
    anchor: "ENR-2.1"
    heading_pattern: "ENR 2.1"
    target_type: "airspace"

  - id: "ENR-3.1"
    name: "Lower ATS Routes"
    category: "ENR"
    scope: "global"
    file_pattern: "EB-ENR-3.1-en-GB.html"
    anchor: "ENR-3.1"
    heading_pattern: "ENR 3.1"
    target_type: "route"

  - id: "ENR-3.2"
    name: "Upper ATS Routes"
    category: "ENR"
    scope: "global"
    file_pattern: "EB-ENR-3.2-en-GB.html"
    anchor: "ENR-3.2"
    heading_pattern: "ENR 3.2"
    target_type: "route"

  - id: "ENR-4.1"
    name: "Radio Navigation Aids - En-Route"
    category: "ENR"
    scope: "global"
    file_pattern: "EB-ENR-4.1-en-GB.html"
    anchor: "ENR-4.1"
    heading_pattern: "ENR 4.1"
    target_type: "navaid"

  - id: "ENR-4.4"
    name: "Significant Points (Waypoints)"
    category: "ENR"
    scope: "global"
    file_pattern: "EB-ENR-4.4-en-GB.html"
    anchor: "ENR-4.4"
    heading_pattern: "ENR 4.4"
    target_type: "waypoint"
    table_locator:
      required_headers:
        - "name-code designator"
        - "coordinates"
    fields:
      designator:
        header_pattern: "name-code designator"
        converter: "text"
      coordinates:
        header_pattern: "coordinates"
        converter: "coordinates"
      atsRoutes:
        header_pattern: "ats route"
        converter: "text"

  - id: "ENR-5.1"
    name: "Prohibited, Restricted and Danger Areas"
    category: "ENR"
    scope: "global"
    file_pattern: "EB-ENR-5.1-en-GB.html"
    anchor: "ENR-5.1"
    heading_pattern: "ENR 5.1"
    target_type: "specialUseArea"

  - id: "ENR-5.2"
    name: "Military Exercise and Training Areas"
    category: "ENR"
    scope: "global"
    file_pattern: "EB-ENR-5.2-en-GB.html"
    anchor: "ENR-5.2"
    heading_pattern: "ENR 5.2"
    target_type: "specialUseArea"
