# section discovery/table allocation specification
# both file matching and element anchor/heading locators are supported.
# see https://www.eurocontrol.int/publication/eurocontrol-specification-electronic-aeronautical-information-publication-eaip
#
# This file is the single source of truth for WHAT gets ingested. Discovery
# derives its download list from this list alone; nothing here is restated in
# Python.
#
# Key semantics:
#   id                      stable section identifier. Never templated.
#   name                    human label, emitted by discovery and used in logs.
#   category                "GEN" | "ENR" | "AD". Emitted by discovery.
#   scope                   "global"       -> one document for the whole AIP
#                           "per_airport"  -> one document per entry in
#                                             airports.yaml target_airports
#   document_id             identity of the FILE this section lives in. All
#                           sections sharing a document_id are grouped into a
#                           single download. Optional; defaults to `id`.
#                           Templated with {icao} when present.
#   file_template           filename, templated with {icao}. Per-airport sections.
#   file_pattern            filename, no templating. Global sections.
#   anchor / anchor_template / heading_pattern / target_type
#                           consumed by the parse layer to locate the slice
#                           inside the downloaded document.

converters_regex:
  coordinates_dms: "(\\d{2})(\\d{2})(\\d{2}(?:\\.\\d+)?)\\s*([NS])\\s*(\\d{3})(\\d{2})(\\d{2}(?:\\.\\d+)?)\\s*([EW])"
  coordinates_dms_compact: "^(\\d{2})(\\d{2})(\\d{2}(?:\\.\\d+)?)([NS])(\\d{3})(\\d{2})(\\d{2}(?:\\.\\d+)?)([EW])$"
  dimensions: "(\\d+(?:[\\s\\u2009\\xa0]\\d+)?)\\s*[xX]\\s*(\\d+)"
  bearing: "(\\d+(?:\\.\\d+)?)"
  elevation: "THR\\s+(\\d+(?:\\.\\d+)?)\\s*FT"
  elevation_fallback: "(\\d+(?:\\.\\d+)?)"
  distance: "(\\d+(?:[\\s\\u2009\\xa0]\\d+)?)"
  frequency_mhz: "(\\d+(?:\\.\\d+)?)\\s*MHZ"
  frequency_ch: "CH\\s*(\\d+)[XY]?"
  ils_caption: "^ILS\\b.*?\\(\\s*(CAT\\s*[IVX]+)\\s*\\)"
  aircraft_type_code: "^[A-Z][A-Z0-9]{1,3}$"
  email: "\\S+@\\S+\\.\\S+"
  ppr_token: "\\bPPR\\b"
  ppr_phrase: "(?i)prior permission"
  limit_flight_level: "^FL\\s*(\\d+)$"
  limit_altitude: "^(\\d+(?:\\.\\d+)?)\\s*(FT|M)\\s*(AMSL|AGL|SFC)?$"
  limit_bare_number: "^(\\d+(?:\\.\\d+)?)$"

surface_mapping:
  asphalt: "ASPH"
  concrete: "CONC"
  grass: "GRAS"
  default: "OTHER"

vertical_limits:
  surface_tokens:
    - "SFC"
    - "GND"
  unlimited_tokens:
    - "UNL"
  upper_tokens:
    - "FL"
    - "UNL"
  lower_tokens:
    - "FL"
    - "FT"
    - "M"
    - "SFC"
    - "GND"
  unlimited_sentinel_val: 999.0
  unlimited_unit: "FL"
  unlimited_reference: "UNL"
  surface_val: 0.0
  surface_unit: "FT"
  surface_reference: "SFC"
  default_altitude_reference: "AMSL"

# AD 2.19 groups LOC/GP/DME sub-rows under a single-cell caption ("ILS 01 ( CAT I)").
# The caption is the only place the ILS category is published; these two keys are
# what the navaid parser reads to interpret it. No facility names, no aerodrome codes.
ils_component_tokens:
  - "LOC"
  - "GP"
  - "DME"

# Designations become natural keys. The AIP prints them typographically (en dashes,
# underscores, mixed case, accented capitals) and sometimes with a non-hierarchical
# slash ("TRA/TSA11" is one area, not a child of TRA), so the key is normalised while
# the `designation` field keeps the verbatim published text.
natural_key_normalisation:
  replacements:
    "_": " "
    "\u2013": "-"   # en dash  (ELTSA6 – DIEKIRCH NORTH)
    "\u2014": "-"   # em dash
    "/": "-"        # interior slash would add a key segment (TRA/TSA11 -> TRA-TSA11)
  whitespace_pattern: "\\s+"
  whitespace_replacement: " "
  # The designator ends at the first " - "; everything after it is the place name.
  code_separator: " - "
  # What the normalised designator must look like — the same charset the validator
  # enforces in natural_key_formats, checked here so a bad key is never emitted.
  key_charset: "^[A-Z0-9][A-Z0-9 -]*$"
  duplicate_suffix_template: "{base}-{n}"

# Tables that sit inside an airspace section but publish no airspace: legend keys
# ("a | b | c | d") and numbered procedure sections ("1.3.7.1 Airspace Allocation
# Procedures"). Such a table is skipped and counted, never turned into a feature.
non_data_row_rules:
  designation_pattern: "^\\d+(\\.\\d+)+\\s"
  min_designation_length: 4
  max_designation_length: 80
  min_value_length: 2

navaid_type_tokens:
  "DVOR / DME": "DVOR/DME"
  "DVOR/DME": "DVOR/DME"
  "VOR / DME": "VOR/DME"
  "VOR/DME": "VOR/DME"
  "DVOR": "DVOR"
  "TACAN": "TACAN"
  "DME": "DME"
  "VOR": "VOR"
  "NDB": "NDB"
  "ILS": "ILS"
  "LOC": "LOC"
  "GP": "GP"
  default: "OTHER"

sections:
  # General Information
  - id: "GEN-0.2"
    name: "Record of AIP Amendments"
    category: "GEN"
    scope: "global"
    file_pattern: "EB-GEN-0.2-en-GB.html"
    anchor: "GEN-0.2"
    heading_pattern: "GEN 0.2"
    target_type: "publicationMetadata"

  - id: "GEN-2.5"
    name: "List of Radio Navigation Aids"
    category: "GEN"
    scope: "global"
    file_pattern: "EB-GEN-2.5-en-GB.html"
    anchor: "GEN-2.5"
    heading_pattern: "GEN 2.5"
    target_type: "navaid"

  # Aerodrome Sections (All live in EB-AD-2.{icao}-en-GB.html)
  - id: "AD-2.1"
    name: "Aerodrome Location Indicator and Name"
    category: "AD"
    scope: "per_airport"
    document_id: "AD-2.{icao}"
    file_template: "EB-AD-2.{icao}-en-GB.html"
    anchor_template: "{icao}-AD-2.1"
    heading_pattern: "AD 2.1"
    target_type: "aerodrome"
    fields:
      airportName:
        source: "paragraph"
        pattern: "^.*\\u2014\\s*(.+)$"
        converter: "text"

  - id: "AD-2.2"
    name: "Aerodrome Geographical and Administrative Data"
    category: "AD"
    scope: "per_airport"
    document_id: "AD-2.{icao}"
    file_template: "EB-AD-2.{icao}-en-GB.html"
    anchor_template: "{icao}-AD-2.2"
    heading_pattern: "AD 2.2"
    target_type: "aerodrome"
    fields:
      arpCoordinates:
        header_pattern: "arp coordinates"
        converter: "coordinates"
      elevation:
        header_pattern: "elevation / reference"
        converter: "elevation"
        unit: "FT"
      geoidUndulation:
        header_pattern: "geoid undulation"
        converter: "elevation"
        unit: "FT"
      referenceTemperature:
        header_pattern: "reference temperature"
        converter: "text"
      magneticVariation:
        header_pattern: "magnetic variation"
        converter: "text"
      operatorName:
        header_pattern: "name of ad operator"
        converter: "text"
      operatorAddress:
        header_pattern: "address"
        converter: "text"
      operatorTel:
        header_pattern: "tel"
        converter: "text"
      operatorFax:
        header_pattern: "fax"
        converter: "text"
      operatorEmail:
        header_pattern: "email"
        converter: "text"
      operatorAfs:
        header_pattern: "afs"
        converter: "text"
      trafficPermitted:
        header_pattern: "types of traffic permitted"
        converter: "text"

  - id: "AD-2.3"
    name: "Operational Hours"
    category: "AD"
    scope: "per_airport"
    document_id: "AD-2.{icao}"
    file_template: "EB-AD-2.{icao}-en-GB.html"
    anchor_template: "{icao}-AD-2.3"
    heading_pattern: "AD 2.3"
    target_type: "operationalInfo"
    fields:
      hoursOperator:
        header_pattern: "ad operator"
        converter: "text"
      hoursCustoms:
        header_pattern: "customs and immigration"
        converter: "text"
      hoursHealth:
        header_pattern: "health"
        converter: "text"
      hoursAisBriefing:
        header_pattern: "ais briefing office"
        converter: "text"
      hoursAro:
        header_pattern: "ats reporting office"
        converter: "text"
      hoursMet:
        header_pattern: "met briefing"
        converter: "text"
      hoursATS:
        header_pattern: "ats"
        converter: "text"
      hoursFuelling:
        header_pattern: "fuelling"
        converter: "text"
      hoursHandling:
        header_pattern: "handling"
        converter: "text"
      hoursSecurity:
        header_pattern: "security"
        converter: "text"
      hoursDeicing:
        header_pattern: "de-icing"
        converter: "text"

  - id: "AD-2.6"
    name: "Rescue and Fire Fighting Services"
    category: "AD"
    scope: "per_airport"
    document_id: "AD-2.{icao}"
    file_template: "EB-AD-2.{icao}-en-GB.html"
    anchor_template: "{icao}-AD-2.6"
    heading_pattern: "AD 2.6"
    target_type: "operationalInfo"
    fields:
      rffsCategory:
        header_pattern: "aerodrome category for fire fighting"
        converter: "text"
      rffsEquipment:
        header_pattern: "rescue equipment"
        converter: "text"
      disabledAircraftRemoval:
        header_pattern: "capability for removal"
        converter: "text"
      remarks:
        header_pattern: "remarks"
        converter: "text"

  - id: "AD-2.12"
    name: "Runway Physical Characteristics"
    category: "AD"
    scope: "per_airport"
    document_id: "AD-2.{icao}"
    file_template: "EB-AD-2.{icao}-en-GB.html"
    anchor_template: "{icao}-AD-2.12"
    heading_pattern: "AD 2.12"
    target_type: "runwayDirection"
    table_locator:
      required_headers:
        - "rwy designator"
        - "true brg"
    fields:
      designator:
        header_pattern: "rwy designator"
        converter: "text"
      trueBearing:
        header_pattern: "true brg"
        converter: "bearing"
        unit: "DEG"
      dimensions:
        header_pattern: "dimensions of rwy"
        converter: "dimensions"
        subfields:
          length:
            unit: "M"
          width:
            unit: "M"
      strength:
        header_pattern: "strength"
        converter: "surface_strength"
      thresholdCoordinates:
        header_pattern: "thr coord"
        converter: "coordinates"
      thresholdElevation:
        header_pattern: "thr elev"
        converter: "elevation"
        unit: "FT"
    pair_fields:
      pairDesignator:
        unit: null
      length:
        unit: "M"
      width:
        unit: "M"
      surface:
        unit: null

  - id: "AD-2.13"
    name: "Declared Distances"
    category: "AD"
    scope: "per_airport"
    document_id: "AD-2.{icao}"
    file_template: "EB-AD-2.{icao}-en-GB.html"
    anchor_template: "{icao}-AD-2.13"
    heading_pattern: "AD 2.13"
    target_type: "runwayDirection"
    table_locator:
      required_headers:
        - "tora"
        - "lda"
    fields:
      tora:
        header_pattern: "tora"
        converter: "distance"
        unit: "M"
      toda:
        header_pattern: "toda"
        converter: "distance"
        unit: "M"
      asda:
        header_pattern: "asda"
        converter: "distance"
        unit: "M"
      lda:
        header_pattern: "lda"
        converter: "distance"
        unit: "M"
      remarks:
        header_pattern: "rmk"
        converter: "text"

  - id: "AD-2.19"
    name: "Radio Navigation and Landing Aids"
    category: "AD"
    scope: "per_airport"
    document_id: "AD-2.{icao}"
    file_template: "EB-AD-2.{icao}-en-GB.html"
    anchor_template: "{icao}-AD-2.19"
    heading_pattern: "AD 2.19"
    target_type: "navaid"
    table_locator:
      required_headers:
        - "type of aid"
        - "id"
        - "frequency"
    fields:
      stationName:
        header_pattern: "type of aid"
        converter: "text"
      designator:
        header_pattern: "id"
        converter: "text"
      frequencyRaw:
        header_pattern: "frequency"
        converter: "text"
      hours:
        header_pattern: "hours"
        converter: "text"
      coordinates:
        header_pattern: "position"
        converter: "coordinates"
      dmeElevation:
        header_pattern: "dme"
        converter: "elevation"
        unit: "FT"
      remarks:
        header_pattern: "remarks"
        converter: "text"
      ilsCategory:
        source: "caption"
        converter: "text"
      component:
        source: "row-label"
        converter: "text"

  - id: "AD-2.14"
    name: "Approach and Runway Lighting"
    category: "AD"
    scope: "per_airport"
    document_id: "AD-2.{icao}"
    file_template: "EB-AD-2.{icao}-en-GB.html"
    anchor_template: "{icao}-AD-2.14"
    heading_pattern: "AD 2.14"
    target_type: "operationalInfo"
    natural_key_template: "{icao}/LIGHTING/{designator}"
    lighting:
      # One table per runway: a single-cell caption ("RWY 01") then ragged rows of
      # key/value pairs, where the section labels ("Approach lighting system",
      # "VASIS", "Touchdown zone lights", ...) introduce the block the following
      # labels belong to. "Type:", "Length:", "Intensity:" and "Colour:" repeat
      # across blocks, so the current section decides which field they fill.
      caption_pattern: "^RWY\\s+(?P<designator>[A-Z0-9]{1,4})$"
      section_tokens:
        - "approach lighting system"
        - "vasis"
        - "runway threshold lights"
        - "touchdown zone lights"
        - "runway end lights"
        - "stopway lights"
        - "runway centre line lights"
        - "runway edge lights"
      # section whose own value follows the label instead of a colon label
      section_value_fields:
        "touchdown zone lights": "touchdownZoneLights"
      # "<section>|<label>" -> field; label is lower-cased with the colon stripped
      section_label_fields:
        "approach lighting system|type": "approachLightingType"
        "approach lighting system|length": "approachLightingLength"
        "approach lighting system|intensity": "approachLightingIntensity"
        # The row after the VASIS pair ("Length: | 900 M | MEHT : | 59 FT") still
        # describes the approach lighting system, not the VASIS.
        "vasis|length": "approachLightingLength"
        "vasis|intensity": "approachLightingIntensity"
        "vasis|type": "vasisType"
        "runway threshold lights|colour": "thresholdLightColour"
      # labels that are unambiguous wherever they appear
      global_label_fields:
        "meht": "meht"
      # fields persisted as value + unit instead of the raw string
      measured_fields:
        - "approachLightingLength"
        - "meht"
      length_pattern: "^(\\d+(?:[\\s\\u2009\\u00a0]\\d+)?)\\s*(M|FT)\\b"

  - id: "AD-2.20"
    name: "Local Aerodrome Regulations"
    category: "AD"
    scope: "per_airport"
    document_id: "AD-2.{icao}"
    file_template: "EB-AD-2.{icao}-en-GB.html"
    anchor_template: "{icao}-AD-2.20"
    heading_pattern: "AD 2.20"
    target_type: "operationalInfo"
    natural_key_template: "{icao}/OPS/LOCAL-REGS"
    fields:
      # Prose and mixed key/value tables. Captured verbatim; no structure is invented
      # from the narrative, only these three facts are derived.
      localRegulationsText:
        source: "section-text"
        converter: "text"
      regulationContactEmails:
        source: "section-text"
        converter: "text"
        emit_when: "at least one email-like string is present"
      pprRequired:
        source: "section-text"
        converter: "boolean"
        emit_when: "standalone PPR token AND a 'prior permission' phrase"

  - id: "AD-2.21"
    name: "Noise Abatement Procedures"
    category: "AD"
    scope: "per_airport"
    document_id: "AD-2.{icao}"
    file_template: "EB-AD-2.{icao}-en-GB.html"
    anchor_template: "{icao}-AD-2.21"
    heading_pattern: "AD 2.21"
    target_type: "operationalInfo"
    natural_key_template: "{icao}/OPS/NOISE"
    fields:
      noiseRelevantAircraftTypes:
        source: "table"
        converter: "text"
        emit_when: "a table exists and every non-empty data cell is an ICAO type code"
      noiseAbatementText:
        source: "section-text"
        converter: "text"

  # En-Route Sections
  - id: "ENR-2.1"
    name: "Air Traffic Services Airspace"
    category: "ENR"
    scope: "global"
    file_pattern: "EB-ENR-2.1-en-GB.html"
    anchor: "ENR-2.1"
    heading_pattern: "ENR 2.1"
    target_type: "airspace"

  - id: "ENR-3.1"
    name: "Lower ATS Routes"
    category: "ENR"
    scope: "global"
    file_pattern: "EB-ENR-3.1-en-GB.html"
    anchor: "ENR-3.1"
    heading_pattern: "ENR 3.1"
    target_type: "route"

  - id: "ENR-3.2"
    name: "Upper ATS Routes"
    category: "ENR"
    scope: "global"
    file_pattern: "EB-ENR-3.2-en-GB.html"
    anchor: "ENR-3.2"
    heading_pattern: "ENR 3.2"
    target_type: "route"

  - id: "ENR-4.1"
    name: "Radio Navigation Aids - En-Route"
    category: "ENR"
    scope: "global"
    file_pattern: "EB-ENR-4.1-en-GB.html"
    anchor: "ENR-4.1"
    heading_pattern: "ENR 4.1"
    target_type: "navaid"
    table_locator:
      required_headers:
        - "name of station"
        - "id"
        - "frequency"
        - "coordinates"
    fields:
      stationName:
        header_pattern: "name of station"
        converter: "text"
      designator:
        header_pattern: "id"
        converter: "text"
      frequencyRaw:
        header_pattern: "frequency"
        converter: "text"
      hours:
        header_pattern: "hours"
        converter: "text"
      coordinates:
        header_pattern: "coordinates"
        converter: "coordinates"
      dmeElevation:
        header_pattern: "dme"
        converter: "elevation"
        unit: "FT"
      remarks:
        header_pattern: "remarks"
        converter: "text"

  - id: "ENR-4.4"
    name: "Significant Points (Waypoints)"
    category: "ENR"
    scope: "global"
    file_pattern: "EB-ENR-4.4-en-GB.html"
    anchor: "ENR-4.4"
    heading_pattern: "ENR 4.4"
    target_type: "waypoint"
    table_locator:
      required_headers:
        - "name-code designator"
        - "coordinates"
    fields:
      designator:
        header_pattern: "name-code designator"
        converter: "text"
      coordinates:
        header_pattern: "coordinates"
        converter: "coordinates"
      atsRoutes:
        header_pattern: "ats route"
        converter: "text"

  - id: "ENR-5.1"
    name: "Prohibited, Restricted and Danger Areas"
    category: "ENR"
    scope: "global"
    file_pattern: "EB-ENR-5.1-en-GB.html"
    anchor: "ENR-5.1"
    heading_pattern: "ENR 5.1"
    target_type: "specialUseArea"

  - id: "ENR-5.2"
    name: "Military Exercise and Training Areas"
    category: "ENR"
    scope: "global"
    file_pattern: "EB-ENR-5.2-en-GB.html"
    anchor: "ENR-5.2"
    heading_pattern: "ENR 5.2"
    target_type: "specialUseArea"
